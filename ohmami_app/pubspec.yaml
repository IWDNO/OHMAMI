name: ohmami_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  web_socket_channel: ^2.2.0
  multicast_dns: ^0.3.0
  share_plus: ^12.0.1
  file_picker: ^10.3.3
  webview_flutter: ^4.9.0
  open_file: ^3.3.2
  home_widget: ^0.7.0
  agora_rtc_engine: ^6.5.3
  permission_handler: ^12.0.1
  flutter_markdown_plus: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
